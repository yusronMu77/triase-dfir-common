[project]
name = "astria-common"
version = "0.3.0"
description = "Pustaka bersama Astria (astria_common): konfigurasi, pagar ASTRIA_ENV, log, health, metrik, auth layanan, event, outbox, konsumen idempoten."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "astria-contracts",
    "fastapi>=0.162.0,<1",
    "uvicorn>=0.54.0,<1",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.2,<3",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0,<1",
    "pyjwt[crypto]>=2.15.1,<3",
    "cryptography>=50.0.2",
    "httpx>=0.28.1,<1",
    "nats-py>=2.16.0,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "psycopg[binary]>=3.3.8,<4",
    "aiosqlite>=0.22.0,<1",
    "orjson>=3.13.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "anyio>=4.11",
    "ruff==0.17.4",
]

[tool.uv.sources]
astria-contracts = { git = "https://github.com/yusronMu77/triase-dfir-contracts", tag = "v0.4.0" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astria_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: butuh PostgreSQL dan NATS (ASTRIA_TEST_DATABASE_URL, ASTRIA_TEST_NATS_URL)"]

[tool.ruff]
line-length = 120
target-version = "py314"
# Berkas templat berisi placeholder {{...}}; diperiksa setelah di-render (CI langkah templat).
extend-exclude = ["template/service"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W", "ASYNC"]
ignore = ["S101", "S104", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["astria_common", "astria_contracts"]
